<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz.css') }}">
</head>
<body>
    <nav>
        <div class="nav-div">
            <img src="{{ url_for('static', filename='resources/image.png') }}" alt="Logo" class="logo">
            <h3>QuizAble</h3>
        </div>
    </nav>
    <div class="quiz-container">
        <div class="quiz-name">
            <h1>Quiz App</h1>
        </div>
        
        <h2 id="section-title">{{ section }}</h2>
        <h3 id="question-number">Question {{ question_number }} of {{ total_questions }}</h3> 

        <div id="question-container">
            <p id="question-text">{{ question['question'] }}</p>
            <form class="form-quiz" method="POST" action="{{ url_for('question') }}">
                {% for i in range(question['answers']|length) %}
                <div>
                    <input type="radio" id="answer{{ i }}" name="answer" value="{{ i }}" required>
                    <label for="answer{{ i }}">{{ question['answers'][i] }}</label>
                </div>
                {% endfor %}
                <div class="quiz-btn">
                    <button type="submit">Next</button>
                </div>
                
            </form>
        </div>
    </div>
</body>
</html>
